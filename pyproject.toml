[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "salud"
description = "Estado de salud y deporte centralizado: datos de Garmin (y más fuentes) en SQLite, con una lectura diaria hecha con Claude."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "garminconnect>=0.3.3",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
salud = "salud.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["salud"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D1", "ARG"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["salud", "tests"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
extraPaths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["salud"]
