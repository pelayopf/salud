<form class="formulario" method="post" action="/comida/productos" data-producto>
  <input type="hidden" name="fecha" value="{{ fecha }}">
  {% if id_propio %}<input type="hidden" name="id" value="{{ id_propio }}">{% endif %}
  {% if momento_defecto %}<input type="hidden" name="momento" value="{{ momento_defecto }}">{% endif %}
  <input type="hidden" name="ia" value="{{ ia | default('') }}">
  {% if origen or (p and p.origen == 'ciqual') %}
  <input type="hidden" name="origen" value="ciqual">
  {% endif %}
  <div class="acciones">
    <button type="button" class="boton secundario" data-leer-etiqueta>Leer la etiqueta</button>
    <input type="file" accept="image/*" data-foto-etiqueta hidden>
  </div>
  <div data-avisos-ia></div>

  {% if codigo_editable %}
  <label for="fp-codigo">Código de barras (opcional)</label>
  <input id="fp-codigo" name="codigo" inputmode="numeric" value="{{ codigo | default('') }}">
  {% else %}
  <input type="hidden" name="codigo" value="{{ codigo | default('') }}">
  {% endif %}

  <label for="fp-nombre">Nombre{% if marcas_ia and 'nombre' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-nombre" name="nombre" class="{% if marcas_ia and 'nombre' in marcas_ia %}de-ia{% endif %}" value="{{ p.nombre if p and p.nombre else '' }}" required>

  <label for="fp-marca">Marca{% if marcas_ia and 'marca' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-marca" name="marca" class="{% if marcas_ia and 'marca' in marcas_ia %}de-ia{% endif %}" value="{{ p.marca if p and p.marca else '' }}">

  <label for="fp-unidad">Unidad{% if marcas_ia and 'unidad' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <select id="fp-unidad" name="unidad" class="{% if marcas_ia and 'unidad' in marcas_ia %}de-ia{% endif %}" required>
    <option value="g"{% if not p or p.unidad == 'g' %} selected{% endif %}>g</option>
    <option value="ml"{% if p and p.unidad == 'ml' %} selected{% endif %}>ml</option>
  </select>

  <label for="fp-kcal">Calorías (kcal){% if marcas_ia and 'kcal' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-kcal" name="kcal" type="number" step="any" min="0" class="{% if marcas_ia and 'kcal' in marcas_ia %}de-ia{% endif %}" value="{{ p.kcal if p and p.kcal is not none else '' }}">

  <label for="fp-proteinas">Proteínas (g){% if marcas_ia and 'proteinas' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-proteinas" name="proteinas" type="number" step="any" min="0" class="{% if marcas_ia and 'proteinas' in marcas_ia %}de-ia{% endif %}" value="{{ p.proteinas if p and p.proteinas is not none else '' }}">

  <label for="fp-hidratos">Hidratos (g){% if marcas_ia and 'hidratos' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-hidratos" name="hidratos" type="number" step="any" min="0" class="{% if marcas_ia and 'hidratos' in marcas_ia %}de-ia{% endif %}" value="{{ p.hidratos if p and p.hidratos is not none else '' }}">

  <label for="fp-grasas">Grasas (g){% if marcas_ia and 'grasas' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-grasas" name="grasas" type="number" step="any" min="0" class="{% if marcas_ia and 'grasas' in marcas_ia %}de-ia{% endif %}" value="{{ p.grasas if p and p.grasas is not none else '' }}">

  <label for="fp-racion-g">Peso de una ración (g o ml){% if marcas_ia and 'racion_g' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-racion-g" name="racion_g" type="number" step="any" min="1" max="2000" class="{% if marcas_ia and 'racion_g' in marcas_ia %}de-ia{% endif %}" value="{{ p.racion_g if p and p.racion_g is not none else '' }}">

  <label for="fp-racion-nombre">Nombre de la ración (p. ej. plátano, rebanada){% if marcas_ia and 'racion_nombre' in marcas_ia %}<span class="chip-ia">IA</span>{% endif %}</label>
  <input id="fp-racion-nombre" name="racion_nombre" maxlength="40" class="{% if marcas_ia and 'racion_nombre' in marcas_ia %}de-ia{% endif %}" value="{{ p.racion_nombre if p and p.racion_nombre else '' }}">

  <p class="suave">Valores por 100 g o 100 ml.</p>
  <div class="acciones"><button type="submit" class="boton">Guardar producto</button></div>
</form>
