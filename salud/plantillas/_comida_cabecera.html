  </div>

    <a href="/comida/consejo?fecha={{ fecha }}{% if momento_elegido %}&momento={{ momento_elegido | urlencode }}{% endif %}"{% if pestana == 'consejo' %} aria-current="page"{% endif %}>¿Qué como?</a>

</header>
